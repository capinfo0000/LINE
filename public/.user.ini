; 顔写真アップロードの上限引き上げ（PHP が CGI/FastCGI/FPM のとき有効）。
; CORESERVER V2 はこの方式なので .user.ini が読まれる。反映まで数分キャッシュされることがある。
; ※ もし mod_php 環境で効かない場合は、サーバのコントロールパネルか php.ini 側で
;   upload_max_filesize / post_max_size を同等に設定すること（.htaccess の php_value は
;   CGI 環境では 500 になるため使わない）。
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 60
